name: cobalt_alpha_prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
    ports:
      - "7860:7860"
    depends_on:
      - phoenix
    extra_hosts:
      - "host.docker.internal:host-gateway"

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - phx_data:/root/.phoenix

volumes:
  phx_data:
